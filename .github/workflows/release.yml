name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # A release that fails its own test suite is worse than no release.
      - name: Test
        run: make test

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build tarballs and .deb
        run: |
          make dist VERSION=${{ steps.v.outputs.version }}
          make deb  VERSION=${{ steps.v.outputs.version }}

      # rpmbuild is not on the runner, and installing it there is slower and
      # less reproducible than building where rpm already lives. The build runs
      # as root inside the container, so it hands ownership back on the way out
      # -- otherwise everything after this silently cannot touch the result.
      - name: Build .rpm
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest sh -c '
            set -e
            dnf install -y rpm-build golang make >/dev/null 2>&1
            make rpm VERSION=${{ steps.v.outputs.version }}
            chown -R '"$(id -u):$(id -g)"' dist
          '

      # A release quietly missing an artifact is worse than a failed one: the
      # install script asks for a file that is not there and the user finds out.
      - name: Check every artifact is present
        run: |
          for pattern in 'dist/*_amd64.deb' 'dist/*_arm64.deb' \
                         'dist/*_linux_amd64.tar.gz' 'dist/*_linux_arm64.tar.gz' \
                         'dist/*_darwin_amd64.tar.gz' 'dist/*_darwin_arm64.tar.gz' \
                         'dist/*.x86_64.rpm'; do
            # shellcheck disable=SC2086
            set -- $pattern
            [ -f "$1" ] || { echo "missing artifact: $pattern"; ls -R dist; exit 1; }
          done
          ls -1 dist

      - name: Checksums
        run: make checksums

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          generate_release_notes: true
